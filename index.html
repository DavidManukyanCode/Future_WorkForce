<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ապագայի աշխատաշուկան</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wdth,wght@62.5..100,100..900&family=Noto+Serif+Armenian:wdth,wght@62.5..100,100..900&family=Noto+Sans:wdth,wght@62.5..100,100..900&family=Noto+Serif:wdth,wght@62.5..100,100..900&display=swap">
<style>
/* Layout: a small bilingual (hy/en) site for a class. Sticky nav lettered Ա–Ե / A–E switches between six screens:
   a start screen built around "the year you start working", four content sections and the quiz. */
:root {
  --bg: #EDF1F4;
  --surface: #FFFFFF;
  --surface-2: #E2E8ED;
  --ink: #13202C;
  --muted: #4F5E6C;
  --line: #CDD6DE;
  --accent: #C1531A;          /* apricot, darkened for contrast */
  --accent-soft: #FAE2D1;
  --on-accent: #FFFFFF;
  --good: #1D7247;
  --good-soft: #DCEFE3;
  --bad: #A93636;
  --bad-soft: #F6DFDF;
  --f-tech: #2D58C8;
  --f-bio: #B3344D;
  --f-eco: #26784B;
  --f-edu: #7449BC;

  --display: "Noto Serif Armenian", "Noto Serif", "Sylfaen", Georgia, serif;
  --body: "Noto Sans Armenian", "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: clamp(1.9rem, 1.4rem + 2vw, 2.6rem);
  --step-4: clamp(2.4rem, 1.6rem + 3.6vw, 4.2rem);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D151C; --surface: #15212B; --surface-2: #1C2B37; --ink: #E6ECF0; --muted: #98A8B5; --line: #2A3A47;
    --accent: #F08A47; --accent-soft: #3A2415; --on-accent: #1A0D04;
    --good: #5CC48C; --good-soft: #14301F; --bad: #EE7F7F; --bad-soft: #3A1B1B;
    --f-tech: #7F9EF2; --f-bio: #EE8197; --f-eco: #6DC690; --f-edu: #B38EF0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D151C; --surface: #15212B; --surface-2: #1C2B37; --ink: #E6ECF0; --muted: #98A8B5; --line: #2A3A47;
  --accent: #F08A47; --accent-soft: #3A2415; --on-accent: #1A0D04;
  --good: #5CC48C; --good-soft: #14301F; --bad: #EE7F7F; --bad-soft: #3A1B1B;
  --f-tech: #7F9EF2; --f-bio: #EE8197; --f-eco: #6DC690; --f-edu: #B38EF0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-0);
  line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.prose { max-width: 65ch; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { font-family: var(--display); font-weight: 800; font-stretch: 80%; font-size: 1.1rem; white-space: nowrap; color: var(--ink); text-decoration: none; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  display: flex; align-items: baseline; gap: 6px;
  padding: 6px 10px; border-radius: 8px;
  color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 0.95rem;
}
.nav a b { font-family: var(--display); color: var(--accent); font-size: 1.05rem; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.lang { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; flex-shrink: 0; }
.lang button { border: 0; background: none; padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 0.9rem; font-weight: 700; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 760px) { .brand { display: none; } }

/* ---------- start screen ---------- */
.hero { padding-block: 56px 40px; }
.hero-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; align-items: start; }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.hero h1 { font-size: var(--step-4); font-weight: 800; font-stretch: 78%; margin-top: 10px; letter-spacing: -0.01em; }
.hero .lead { font-size: var(--step-1); margin-top: 18px; max-width: 34em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 20px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; cursor: pointer;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }

.yearcard {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px; display: grid; gap: 14px;
}
.ylabel { font-weight: 600; }
.ages { display: flex; flex-wrap: wrap; gap: 6px; }
.ages button {
  min-width: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 600;
}
.ages button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bigyear {
  font-family: var(--display); font-weight: 900; font-stretch: 70%;
  font-size: clamp(4.2rem, 3rem + 5vw, 6.6rem); line-height: 0.95; color: var(--accent);
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.yearcard .note { font-size: var(--step--1); color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 44px; border-top: 1px solid var(--line); }
.stat { padding: 18px 20px 0 0; display: grid; gap: 4px; align-content: start; }
.stat + .stat { padding-left: 20px; border-left: 1px solid var(--line); }
.stat .num { font-family: var(--display); font-weight: 800; font-stretch: 80%; font-size: var(--step-3); font-variant-numeric: tabular-nums; }
.stat .cap { color: var(--muted); font-size: 0.97rem; }
.source { font-size: var(--step--1); color: var(--muted); margin-top: 16px; }
@media (max-width: 820px) {
  .hero-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr; }
  .stat, .stat + .stat { padding: 14px 0; border-left: 0; border-bottom: 1px solid var(--line); }
}

.menu-wrap { padding-block: 8px 64px; }
.menu-title { font-size: var(--step-2); font-weight: 800; font-stretch: 85%; margin-bottom: 16px; }
.menu { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mcard {
  display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start;
  padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  color: var(--ink); text-decoration: none; transition: border-color 0.15s, transform 0.15s;
}
.mcard:hover { border-color: var(--accent); transform: translateY(-2px); }
.mletter { font-family: var(--display); font-weight: 900; font-stretch: 70%; font-size: 2.6rem; line-height: 0.9; color: var(--accent); min-width: 1ch; }
.mbody { display: grid; gap: 4px; min-width: 0; }
.mbody b { font-family: var(--display); font-size: var(--step-1); line-height: 1.25; }
.mbody span { color: var(--muted); font-size: 0.97rem; }
.mcard.featured { grid-column: span 2; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.mcard.featured .mletter, .mcard.featured .mbody span { color: var(--on-accent); }
@media (max-width: 900px) { .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); } .mcard.featured { grid-column: 1 / -1; order: 1; } }
@media (max-width: 560px) { .menu { grid-template-columns: 1fr; } }

/* ---------- section screens ---------- */
section.block { padding-block: 40px 64px; }
.sec-head { display: grid; grid-template-columns: auto 1fr; gap: 6px 22px; align-items: start; margin-bottom: 30px; }
.sec-letter {
  font-family: var(--display); font-weight: 900; font-stretch: 70%;
  font-size: clamp(3.4rem, 2.6rem + 3vw, 5rem); line-height: 0.85; color: var(--accent);
  grid-row: span 2; min-width: 1ch;
}
.sec-head h2 { font-size: var(--step-3); font-weight: 800; font-stretch: 85%; }
.sec-head p { color: var(--muted); font-size: var(--step-1); max-width: 40em; }
h3.sub { font-size: var(--step-2); font-weight: 700; font-stretch: 88%; margin: 44px 0 16px; }
.sec-head + h3.sub { margin-top: 0; }
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line); }

/* field tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.tab {
  padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.tab i { width: 10px; height: 10px; border-radius: 50%; background: var(--fc); display: inline-block; }
.tab[aria-selected="true"] { background: var(--fc); border-color: var(--fc); color: var(--surface); }
.tab[aria-selected="true"] i { background: var(--surface); }

.profgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 760px) { .profgrid { grid-template-columns: 1fr; } }
.prof {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  border-top: 4px solid var(--fc); padding: 20px 22px; display: grid; gap: 10px; align-content: start; min-width: 0;
}
.prof .alt { font-size: var(--step--1); color: var(--fc); font-weight: 700; letter-spacing: 0.02em; }
.prof h4 { font-family: var(--display); font-size: var(--step-1); font-weight: 700; margin: 0; line-height: 1.25; }
.prof .why { font-size: 0.97rem; color: var(--muted); }
.prof .why b { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips .lbl { font-size: var(--step--1); color: var(--muted); margin-right: 2px; }
.chip { font-size: var(--step--1); padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }

/* skills */
.tshape { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 32px; align-items: center; margin-bottom: 36px; }
.tdiag { display: grid; justify-items: center; }
.tdiag .bar { width: 100%; max-width: 420px; background: var(--accent); color: var(--on-accent); border-radius: 10px 10px 4px 4px; padding: 12px 16px; text-align: center; font-weight: 700; }
.tdiag .stem { width: 140px; min-height: 170px; background: var(--ink); color: var(--bg); border-radius: 0 0 10px 10px; padding: 14px 10px; text-align: center; font-weight: 700; display: grid; align-content: center; }
.tdiag small { display: block; font-weight: 400; opacity: 0.85; font-size: var(--step--1); }
.tside { display: grid; gap: 18px; }
.callout { border-left: 4px solid var(--accent); padding: 4px 0 4px 18px; font-size: var(--step-1); }
@media (max-width: 760px) { .tshape { grid-template-columns: 1fr; } }

.skillcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
@media (max-width: 820px) { .skillcols { grid-template-columns: 1fr; } }
.skillcol h3 { font-size: var(--step-2); font-weight: 700; font-stretch: 88%; margin-bottom: 4px; }
.skillcol > p { color: var(--muted); margin-bottom: 16px; }
.skill { padding: 16px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.skill h4 { margin: 0; font-size: var(--step-1); font-family: var(--display); font-weight: 700; }
.skill h4 span { font-family: var(--body); font-size: var(--step--1); font-weight: 600; color: var(--muted); margin-left: 6px; }
.skill .try { font-size: 0.97rem; background: var(--surface); border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); }
.skill .try b { color: var(--accent); }

/* AI */
.shift { display: grid; gap: 10px; }
.shift-row, .shift-head { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr) minmax(0, 1.6fr); gap: 14px; align-items: center; }
.shift-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.shift-row .old { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.shift-row .arrow { color: var(--accent); font-size: 1.4rem; text-align: center; }
.shift-row .new { font-weight: 700; }
.shift-row .how { font-size: 0.95rem; color: var(--muted); }
.shift-head { padding: 0 18px; font-size: var(--step--1); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
@media (max-width: 760px) {
  .shift-head { display: none; }
  .shift-row { grid-template-columns: 1fr; gap: 4px; }
  .shift-row .arrow { text-align: left; transform: rotate(90deg); width: 24px; }
}
.principle { margin-top: 18px; font-size: var(--step-1); max-width: 46em; }

.human { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .human { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .human { grid-template-columns: 1fr; } }
.human article { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 20px; display: grid; gap: 8px; align-content: start; }
.human h4 { margin: 0; font-family: var(--display); font-size: var(--step-1); font-weight: 700; }
.human .ex { font-size: 0.95rem; color: var(--muted); }

.game-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.game-tools { display: flex; gap: 14px; align-items: center; }
.score { font-weight: 700; font-variant-numeric: tabular-nums; }
.tasks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .tasks { grid-template-columns: 1fr; } }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.task .q { font-weight: 600; font-size: 1.05rem; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 600; }
.choices button:hover:not(:disabled) { border-color: var(--ink); }
.choices button:disabled { cursor: default; opacity: 0.55; }
.choices button.right { background: var(--good-soft); border-color: var(--good); color: var(--good); opacity: 1; }
.choices button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); opacity: 1; }
.task .exp { font-size: 0.95rem; }
.task .exp b.ok { color: var(--good); }
.task .exp b.no { color: var(--bad); }

/* quiz */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(20px, 3vw, 40px); }
.qprog { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: var(--step--1); color: var(--muted); font-weight: 600; }
.qbar { height: 6px; background: var(--surface-2); border-radius: 99px; margin: 10px 0 26px; overflow: hidden; }
.qbar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
.quiz h3.qtext { font-size: var(--step-3); font-weight: 800; font-stretch: 85%; margin-bottom: 22px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .opts { grid-template-columns: 1fr; } }
.opt {
  display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; text-align: left;
  padding: 16px 18px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); cursor: pointer; font-size: var(--step-0);
}
.opt:hover { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .ltr { font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--accent); text-align: center; }
.qnav { margin-top: 20px; display: flex; gap: 10px; }
.linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 0; text-decoration: underline; }

.result { display: grid; gap: 22px; }
.arche { display: grid; gap: 10px; }
.arche .aname { font-size: var(--step-4); font-weight: 800; font-stretch: 78%; }
.arche .second { color: var(--muted); max-width: 46em; }
.rprof { display: grid; gap: 10px; padding-top: 26px; border-top: 1px solid var(--line); }
.rprof .rname { font-size: var(--step-3); font-weight: 800; font-stretch: 78%; color: var(--accent); }
.result .tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fc); }
.result .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--fc); }
.result .rlead { font-size: var(--step-1); max-width: 44em; }
.rcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.rcols.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 860px) { .rcols.three { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .rcols { grid-template-columns: 1fr; } }
.rbox { background: var(--bg); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.rbox h4 { margin: 0 0 8px; font-family: var(--display); font-size: var(--step-1); }
.rbox ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.profile { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 44px; gap: 12px; align-items: center; font-size: 0.95rem; }
.prow .track { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.prow .fill { height: 100%; background: var(--accent); border-radius: 99px; }
.prow .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
@media (max-width: 520px) { .prow { grid-template-columns: 110px minmax(0, 1fr) 40px; } }
.alts-block { display: grid; gap: 10px; }
.alts-block h4 { margin: 0; font-family: var(--display); font-size: var(--step-1); }
.alts { display: flex; flex-wrap: wrap; gap: 10px; }
.disclaimer { font-size: 0.97rem; color: var(--muted); max-width: 46em; }

/* tips */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) { .stages { grid-template-columns: 1fr; } }
.stage { padding: 0 24px 0 0; display: grid; gap: 4px; align-content: start; }
.stage + .stage { padding-left: 24px; border-left: 1px solid var(--line); }
@media (max-width: 900px) { .stage, .stage + .stage { padding: 0 0 24px; border-left: 0; } .stage + .stage { padding-top: 24px; border-top: 1px solid var(--line); } }
.stage .when { font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; color: var(--accent); }
.stage h3 { font-size: var(--step-2); font-weight: 800; font-stretch: 85%; margin-bottom: 10px; }
.tip { padding: 12px 0; border-top: 1px solid var(--line); }
.tip h4 { margin: 0 0 4px; font-size: 1.05rem; }

  function head(i, title, intro) {

  function pager(v) {
    const order = VIEWS.slice(1), i = order.indexOf(v);
    const prev = i === 0 ? "home" : order[i - 1], next = order[i + 1];
    return '<nav class="pager" aria-label="' + S.ui.pagerAria + '">' +
      '<a class="btn" href="#' + prev + '">← ' + S.ui.viewNames[prev] + '</a>' +
      (next ? '<a class="btn primary" href="#' + next + '">' + S.ui.viewNames[next] + ' →</a>'
            : '<a class="btn primary" href="#home">' + S.ui.backHome + '</a>') +
      '</nav>';

        '<div class="cta"><a class="btn primary" href="#test">' + u.cta1 + '</a><a class="btn" href="#professions">' + u.cta2 + '</a></div>' +
      '</div>' +
      '<div class="yearcard">' +
        '<p class="ylabel" id="age-label">' + u.ageLabel + '</p>' +
        '<div class="ages" id="ages" role="group" aria-labelledby="age-label">' + ages + '</div>' +
        '<div><p class="muted">' + u.startWork + '</p><p class="bigyear" id="bigyear"></p></div>' +
        '<p id="yeartext" aria-live="polite"></p>' +
        '<p class="note">' + u.ageNote + '</p>' +
      '</div></div>' +
      '<div class="stats">' + u.stats.map(s => '<div class="stat"><span class="num">' + s[0] + '</span><span class="cap">' + s[1] + '</span></div>').join("") + '</div>' +
      '<p class="source">' + u.source + '</p></div>' +
      '<div class="wrap menu-wrap"><h2 class="menu-title">' + u.menuTitle + '</h2><div class="menu">' +
        VIEWS.slice(1).map((v, i) => '<a class="mcard' + (v === "test" ? " featured" : "") + '" href="#' + v + '"><span class="mletter">' + u.letters[i] + '</span><span class="mbody"><b>' + u.menu[i][0] + '</b><span>' + u.menu[i][1] + '</span></span></a>').join("") +
      '</div></div>';
    $("#ages").addEventListener("click", e => {
      const b = e.target.closest("button[data-age]");
      if (b) { STATE.age = +b.dataset.age; setAge(); }
    });
    setAge();
  }
  function setAge() {
    const years = Math.max(1, 22 - STATE.age);
    $("#bigyear").textContent = new Date().getFullYear() + years;
    $("#yeartext").textContent = S.ui.yearText(years);
    document.querySelectorAll("#ages button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.age === STATE.age)));
  }

  /* =====================================================================
     Ա / A: professions
     ===================================================================== */
  function profCard(p) {
    const t = S.profs[p.id];
    return '<article class="prof" style="--fc:' + FIELD_COLORS[p.field] + '">' +
      '<p class="alt" lang="' + (STATE.lang === "hy" ? "en" : "hy") + '">' + other().profs[p.id].name + '</p>' +
      '<h4>' + t.name + '</h4>' +
      '<p>' + t.does + '</p>' +
      '<p class="why"><b>' + S.ui.whyLabel + '</b> ' + t.why + '</p>' +
      '<div class="chips"><span class="lbl">' + S.ui.subjLabel + '</span>' + t.subjects.map(s => '<span class="chip">' + s + '</span>').join("") + '</div>' +
      '</article>';
  }
  function renderProfessions() {
    const u = S.ui;
    $("#professions").innerHTML = '<div class="wrap">' + head(0, u.profTitle, u.profIntro) +
      '<div class="tabs" role="tablist" aria-label="' + u.fieldsAria + '">' +
        FIELD_KEYS.map(k => '<button type="button" class="tab" role="tab" data-f="' + k + '" aria-selected="' + (k === STATE.field) + '" style="--fc:' + FIELD_COLORS[k] + '"><i></i>' + S.fields[k] + '</button>').join("") +
      '</div>' +
      '<div class="profgrid" role="tabpanel">' + PROFS.filter(p => p.field === STATE.field).map(profCard).join("") + '</div>' +
      pager("professions") + '</div>';
    $("#professions .tabs").addEventListener("click", e => {
      const b = e.target.closest(".tab");
      if (b) { STATE.field = b.dataset.f; renderProfessions(); $('#professions .tab[data-f="' + STATE.field + '"]').focus(); }
    });
  }

  /* =====================================================================
     Բ / B: skills
     ===================================================================== */
  function skillItem(s) {
    return '<div class="skill"><h4>' + s.n + '<span lang="' + (STATE.lang === "hy" ? "en" : "hy") + '">' + s.en + '</span></h4><p>' + s.d + '</p>' +
      '<p class="try"><b>' + S.ui.practice + '</b> ' + s.t + '</p></div>';
  }
  function renderSkills() {
    const u = S.ui;
    $("#skills").innerHTML = '<div class="wrap">' + head(1, u.skillsTitle, u.skillsIntro) +
      '<div class="tshape">' +
        '<div class="tdiag" aria-hidden="true"><div class="bar">' + u.tBar + '<small>' + u.tBarSmall + '</small></div><div class="stem">' + u.tStem + '<small>' + u.tStemSmall + '</small></div></div>' +
        '<div class="tside"><p class="prose">' + u.tText + '</p><p class="callout">' + u.callout + '</p></div>' +
      '</div>' +
      '<div class="skillcols">' +
        '<div class="skillcol"><h3>' + u.softTitle + '</h3><p>' + u.softSub + '</p>' + S.soft.map(skillItem).join("") + '</div>' +
        '<div class="skillcol"><h3>' + u.hardTitle + '</h3><p>' + u.hardSub + '</p>' + S.hard.map(skillItem).join("") + '</div>' +
      '</div>' + pager("skills") + '</div>';
  }

  /* =====================================================================
     Գ / C: AI, automation and the class game
     ===================================================================== */
  function renderAI() {
    const u = S.ui;
    $("#ai").innerHTML = '<div class="wrap">' + head(2, u.aiTitle, u.aiIntro) +
      '<h3 class="sub">' + u.shiftTitle + '</h3>' +
      '<div class="shift" role="list">' +
        '<div class="shift-head" aria-hidden="true"><span>' + u.shiftHead[0] + '</span><span></span><span>' + u.shiftHead[1] + '</span><span>' + u.shiftHead[2] + '</span></div>' +
        S.shifts.map(s => '<div class="shift-row" role="listitem"><span class="old">' + s[0] + '</span><span class="arrow" aria-hidden="true">→</span><span class="new">' + s[1] + '</span><span class="how">' + s[2] + '</span></div>').join("") +
      '</div>' +
      '<p class="principle">' + u.principle + '</p>' +
      '<h3 class="sub">' + u.humanTitle + '</h3>' +
      '<div class="human">' + S.human.map(h => '<article><h4>' + h.n + '</h4><p>' + h.d + '</p><p class="ex">' + h.ex + '</p></article>').join("") + '</div>' +
      '<h3 class="sub">' + u.gameTitle + '</h3>' +
      '<div class="game-top"><p class="prose">' + u.gameIntro + '</p>' +
        '<div class="game-tools"><span class="score" id="score"></span><button class="btn" id="resetgame" type="button">' + u.reset + '</button></div></div>' +
      '<div class="tasks" id="tasks"></div>' +
      pager("ai") + '</div>';
    $("#tasks").addEventListener("click", e => {
      const b = e.target.closest("button[data-k]");
      if (!b || b.disabled) return;
      STATE.game[+b.dataset.i] = b.dataset.k;
      renderGame();
      const exp = document.querySelector('#tasks .task[data-i="' + b.dataset.i + '"] .exp');
      if (exp) exp.focus();
    });
    $("#resetgame").addEventListener("click", () => { STATE.game = []; renderGame(); });
    renderGame();
  }
  function renderGame() {
    const u = S.ui;
    let answered = 0, correct = 0;
    $("#tasks").innerHTML = S.tasks.map((t, i) => {
      const ans = TASK_ANS[i], ch = STATE.game[i];
      if (ch) { answered++; if (ch === ans) correct++; }
      const buttons = ["ai", "human", "both"].map(k => {
        let cls = "";
        if (ch) { if (k === ans) cls = "right"; else if (k === ch) cls = "wrong"; }
        return '<button type="button" data-i="' + i + '" data-k="' + k + '"' + (cls ? ' class="' + cls + '"' : "") + (ch ? " disabled" : "") + '>' + u.labels[k] + '</button>';
      }).join("");
      const exp = ch ? '<p class="exp" tabindex="-1">' + (ch === ans ? '<b class="ok">' + u.right + '</b> ' : '<b class="no">' + u.wrong(u.labels[ans]) + '</b> ') + t.e + '</p>' : "";
      return '<div class="task" data-i="' + i + '"><p class="q">' + t.q + '</p><div class="choices">' + buttons + '</div>' + exp + '</div>';
    }).join("");
    $("#score").textContent = u.score(correct, answered);
  }

  /* =====================================================================
     Դ / D: quiz
     ===================================================================== */
  function profileOf(ans) {
    const u = {}; TKEYS.forEach(t => u[t] = 0);
    ans.forEach((ai, qi) => { const w = QW[qi][ai]; Object.keys(w).forEach(t => u[t] += w[t]); });
    return u;
  }
  function rank(u) {
    return PROFS.map(p => {
      let dot = 0, norm = 0;
      TKEYS.forEach(t => { const w = p.w[t] || 0; dot += (QMAX[t] ? u[t] / QMAX[t] : 0) * w; norm += w * w; });
      return { p, s: dot / Math.sqrt(norm) };
    }).sort((a, b) => b.s - a.s);
  }
  function renderTest() {
    $("#test").innerHTML = '<div class="wrap">' + head(3, S.ui.testTitle, S.ui.testIntro) +
      '<div class="quiz" id="quiz"></div>' + pager("test") + '</div>';
    renderQuiz();
  }
  function renderQuiz() { if (STATE.done) renderResult(); else renderQuestion(); }

  function renderQuestion() {
    const u = S.ui, n = QW.length, q = S.questions[STATE.step];
    const quizEl = $("#quiz");
    quizEl.innerHTML =
      '<div class="qprog"><span>' + u.qOf(STATE.step + 1, n) + '</span></div>' +
      '<div class="qbar"><span style="width:' + (STATE.step / n * 100) + '%"></span></div>' +
      '<h3 class="qtext">' + q.q + '</h3>' +
      '<div class="opts">' + q.o.map((t, i) =>
        '<button type="button" class="opt" data-o="' + i + '" aria-pressed="' + (STATE.answers[STATE.step] === i) + '"><span class="ltr">' + u.optLetters[i] + '</span><span>' + t + '</span></button>').join("") +
      '</div>' +
      (STATE.step > 0 ? '<div class="qnav"><button type="button" class="linkbtn" id="qback">' + u.back + '</button></div>' : "");
    quizEl.querySelector(".opts").addEventListener("click", e => {
      const b = e.target.closest(".opt");
      if (!b) return;
      const i = +b.dataset.o;
      STATE.answers[STATE.step] = i;
      quizEl.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      setTimeout(() => {
        if (STATE.step < n - 1) STATE.step++; else STATE.done = true;
        renderQuiz();
        const first = quizEl.querySelector(".opt, .aname");
        if (first && STATE.done) quizEl.scrollIntoView({ block: "start" });
      }, 260);
    });
    const back = $("#qback");
    if (back) back.addEventListener("click", () => { STATE.step--; renderQuiz(); });
  }

  function renderResult() {
    const u = S.ui;
    const prof = profileOf(STATE.answers);
    const ranked = rank(prof);
    const main = STATE.chosen ? (ranked.find(x => x.p.id === STATE.chosen) || ranked[0]).p : ranked[0].p;
    const alts = ranked.map(x => x.p).filter(p => p.id !== main.id).slice(0, 3);
    const t = S.profs[main.id];

    const pct = {}; TKEYS.forEach(k => pct[k] = QMAX[k] ? Math.round(prof[k] / QMAX[k] * 100) : 0);
    const order = TKEYS.slice().sort((a, b) => pct[b] - pct[a]);
    const a1 = S.archetypes[order[0]], a2 = S.archetypes[order[1]];
    const topTraits = order.filter(k => pct[k] > 0).slice(0, 3);
    let shared = topTraits.filter(k => main.w[k]);
    if (!shared.length) shared = topTraits.slice(0, 2);
    const traitList = joinList(shared.map(k => "<b>" + S.traits[k] + "</b>"));

    const quizEl = $("#quiz");
    quizEl.innerHTML =
      '<div class="result" style="--fc:' + FIELD_COLORS[main.field] + '">' +
        '<div><div class="qprog"><span>' + u.result + '</span></div><div class="qbar"><span style="width:100%"></span></div></div>' +
        '<div class="arche">' +
          '<p class="eyebrow">' + u.yourType + '</p>' +
          '<h3 class="aname">' + a1.name + '</h3>' +
          '<p class="rlead">' + a1.desc + '</p>' +
          '<p class="second">' + u.second(a2.name, a2.short) + '</p>' +
        '</div>' +
        '<div class="rcols three">' +
          '<div class="rbox"><h4>' + u.strengthsT + '</h4><ul>' + a1.strengths.map(li).join("") + '</ul></div>' +
          '<div class="rbox"><h4>' + u.shineT + '</h4><p>' + a1.shine + '</p></div>' +
          '<div class="rbox"><h4>' + u.growT + '</h4><p>' + a1.grow + '</p></div>' +
        '</div>' +
        '<div class="rbox"><h4>' + u.profileT + '</h4><div class="profile">' +
          order.map(k => '<div class="prow"><span>' + S.traits[k] + '</span><span class="track"><span class="fill" style="width:' + pct[k] + '%"></span></span><span class="pct">' + pct[k] + '%</span></div>').join("") +
        '</div></div>' +
        '<div class="rprof">' +
          '<p class="eyebrow">' + u.matchEyebrow + '</p>' +
          '<h3 class="rname">' + t.name + '</h3>' +
          '<p class="tag"><i></i>' + S.fields[main.field] + '</p>' +
          '<p class="rlead">' + u.traitsLine(traitList) + '</p>' +
          '<p class="prose">' + t.does + ' ' + t.why + '</p>' +
        '</div>' +
        '<div class="rcols">' +
          '<div class="rbox"><h4>' + u.needSkills + '</h4><ul>' + t.skills.map(li).join("") + '</ul></div>' +
          '<div class="rbox"><h4>' + u.startNow + '</h4><ul>' + t.steps.map(li).join("") + '</ul></div>' +
        '</div>' +
        '<div class="alts-block"><h4>' + u.alsoFit + '</h4><div class="alts">' +
          alts.map(p => '<button type="button" class="btn" data-alt="' + p.id + '">' + S.profs[p.id].name + '</button>').join("") +
        '</div></div>' +
        '<p class="disclaimer">' + u.disclaimer + '</p>' +
        '<div class="cta"><button type="button" class="btn primary" id="retry">' + u.retry + '</button>' +
          '<a class="btn" href="#professions" id="allprofs">' + u.allProfs + '</a></div>' +
      '</div>';
    quizEl.querySelector(".alts").addEventListener("click", e => {
      const b = e.target.closest("button[data-alt]");
      if (!b) return;
      STATE.chosen = b.dataset.alt;
      renderQuiz();
      quizEl.querySelector(".rprof").scrollIntoView({ block: "start" });
    });
    $("#retry").addEventListener("click", () => {
      STATE.step = 0; STATE.answers = []; STATE.done = false; STATE.chosen = null;
      renderQuiz();
      quizEl.scrollIntoView({ block: "start" });
    });
    $("#allprofs").addEventListener("click", () => { STATE.field = main.field; renderProfessions(); });
  }

  /* =====================================================================
     Ե / E: tips
     ===================================================================== */
  function renderTips() {
    const u = S.ui;
    $("#tips").innerHTML = '<div class="wrap">' + head(4, u.tipsTitle, u.tipsIntro) +
      '<div class="stages">' + S.stages.map(s =>
        '<div class="stage"><p class="when">' + s.when + '</p><h3>' + s.h + '</h3>' +
          s.tips.map(tp => '<div class="tip"><h4>' + tp[0] + '</h4><p>' + tp[1] + '</p></div>').join("") +
        '</div>').join("") + '</div>' +
      '<div class="closing"><p>' + u.closing + '</p></div>' +
      pager("tips") + '</div>';
  }

  /* =====================================================================
     Routing and language
     ===================================================================== */
  function renderAll() {
    renderChrome(); renderHome(); renderProfessions(); renderSkills(); renderAI(); renderTest(); renderTips();
  }
  function route(scroll) {
    let id = location.hash.slice(1);
    if (!VIEWS.includes(id)) id = "home";
    VIEWS.forEach(v => { document.getElementById(v).hidden = v !== id; });
    document.querySelectorAll("#nav a").forEach(a => {
      if (a.getAttribute("href") === "#" + id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (scroll) window.scrollTo({ top: 0, behavior: "instant" });
  }
  function setLang(l) {
    if (l === STATE.lang) return;
    STATE.lang = l; S = TEXT[l];
    try { localStorage.setItem("fw-lang", l); } catch (e) {}
    renderAll(); route(false);
  }
  document.querySelector(".lang").addEventListener("click", e => {
    const b = e.target.closest("button[data-lang]");
    if (b) setLang(b.dataset.lang);
  });
  window.addEventListener("hashchange", () => route(true));

  renderAll();
  route(true);
})();
</script>

</body></html>
